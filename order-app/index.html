<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPICY KING MOTONARI</title>
<script>
// ────── /order-app/ → ルート / 統合リダイレクト ──────
// 店舗はルート / でオーダーAPP を運用している。
// 旧テスト用パス /order-app/ に来た場合も、クエリ(?table=..&test=1)を保持したまま
// ルート / の最新オーダーAPP へ転送する。二重メンテを避けるためのスタブ。
(function(){
  try {
    var dest = location.origin
      + location.pathname.replace(/\/order-app\/?.*$/, '/')
      + location.search + location.hash;
    location.replace(dest);
  } catch(_) {
    location.replace('../' + location.search + location.hash);
  }
})();
</script>
</head>
<body>
<noscript><a href="../">オーダーページへ移動</a></noscript>
</body>
</html>
